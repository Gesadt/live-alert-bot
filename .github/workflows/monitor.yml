name: Stripchat Live Monitor

on:
  schedule:
    # Every 10 minutes. Each run installs Chromium, so this leaves margin;
    # tighten to */5 later if you want faster alerts (still free either way).
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the updated state.json

concurrency:
  group: stripchat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          for i in 1 2 3; do
            playwright install --with-deps chromium && exit 0
            echo "Install attempt $i failed (likely a transient apt mirror issue) -- retrying in 15s..."
            sleep 15
          done
          echo "All 3 install attempts failed -- failing this step explicitly."
          exit 1

      - name: Check Stripchat status
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STRIPCHAT_USERNAMES: ${{ secrets.STRIPCHAT_USERNAMES }}
          DISCORD_PING: "@here" # change to a role mention, or "" for no ping
        run: python check_stripchat.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --staged --quiet || git commit -m "Update state [skip ci]"
            git push
          else
            echo "state.json not present this run -- nothing to commit"
          fi
