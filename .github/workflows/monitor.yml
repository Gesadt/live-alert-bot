name: Stripchat Live Monitor

on:
  schedule:
    # Backup only -- GitHub's native schedule trigger is unreliable for
    # frequent intervals on public repos (see README "Reliable triggering").
    # The real trigger is an external cron-job.org call to workflow_dispatch.
    - cron: "*/10 * * * *"
  workflow_dispatch: # triggered externally by cron-job.org (and manually from here)
    inputs:
      force_report:
        description: "Post a preview of this week's stats report now (testing)"
        type: boolean
        default: false

permissions:
  contents: write # needed so the workflow can commit the updated state.json

concurrency:
  group: stripchat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          for i in 1 2 3; do
            playwright install --with-deps chromium && exit 0
            echo "Install attempt $i failed (likely a transient apt mirror issue) -- retrying in 15s..."
            sleep 15
          done
          echo "All 3 install attempts failed -- failing this step explicitly."
          exit 1

      - name: Check Stripchat status
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STRIPCHAT_USERNAMES: ${{ secrets.STRIPCHAT_USERNAMES }}
          DISCORD_PING: "@here" # change to a role mention, or "" for no ping
          # Optional stream statistics -- skipped automatically if not set:
          DISCORD_STATS_WEBHOOK_URL: ${{ secrets.DISCORD_STATS_WEBHOOK_URL }}
          STATS_REPO: ${{ secrets.STATS_REPO }}
          STATS_REPO_TOKEN: ${{ secrets.STATS_REPO_TOKEN }}
          STATS_TIMEZONE: "Europe/Vilnius"
          FORCE_REPORT: ${{ inputs.force_report }}
        run: python check_stripchat.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f state.json ]; then
            echo "state.json not present this run -- nothing to commit"
            exit 0
          fi
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $i) -- main moved on since checkout "\
                 "(e.g. a manual code push landed mid-run). Pulling latest and retrying..."
            git pull --rebase origin main
          done
          echo "Failed to push state.json after 3 attempts"
          exit 1
